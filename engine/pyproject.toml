[project]
name = "sozvon-engine"
version = "0.1.0"
description = "Sozvon: local call transcription engine (mlx-whisper + pyannote)"
requires-python = ">=3.12"
dependencies = [
    "hf-transfer>=0.1.9",
    "imageio-ffmpeg>=0.6.0",
    "mcp[cli]>=1.28.1,<2",
    "mlx-whisper>=0.4.3; sys_platform != 'win32'",
    "faster-whisper>=1.2.1; sys_platform == 'win32'",
    "onnx-asr[cpu,hub]>=0.12.0",
    "pyannote.audio>=3.3.2",
    "einops==0.8.2",   # the vendored neural echo model (sozvon_engine/localvqe)
    "python-dotenv>=1.0.1",
    "scipy==1.18.1",   # the listening file's levelling (pipeline/listen.py)
    "snowballstemmer>=3.1.1",
    "truststore>=0.10.5",  # trust the system certificate store (macOS Keychain, Windows store): company root certificates
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
