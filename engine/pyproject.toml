[project]
name = "sozvon-engine"
version = "0.1.0"
description = "Sozvon: local call transcription engine (mlx-whisper + pyannote)"
requires-python = ">=3.12"
dependencies = [
    "hf-transfer>=0.1.9",
    "imageio-ffmpeg>=0.6.0",
    "mcp[cli]>=1.28.1,<2",
    "mlx-whisper>=0.4.3",
    "onnx-asr[cpu,hub]>=0.12.0",
    "pyannote.audio>=3.3.2",
    "python-dotenv>=1.0.1",
    "snowballstemmer>=3.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
