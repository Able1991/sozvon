# Release: tag vX.Y.Z → build, Developer ID signing, notarization, DMG in GitHub Releases.
#   git tag v0.2.0 && git push origin v0.2.0
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEVELOPER_ID_P12          "Developer ID Application" certificate as .p12, base64
#   DEVELOPER_ID_P12_PASSWORD password for the .p12
#   NOTARY_KEY_P8             App Store Connect API key (.p8), base64
#   NOTARY_KEY_ID             Key ID
#   NOTARY_ISSUER_ID          Issuer ID
#   SPARKLE_ED_KEY            EdDSA private key for updates (base64, 32 bytes; public half is SUPublicEDKey in build.sh)
# Without the secrets the release still builds, but unsigned (marked as pre-release).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    # Apple's notarization queue sometimes takes hours: better to fail and rerun.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Select Xcode 26 (macOS 26 SDK for Liquid Glass)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      # Node.js 22+: build.sh bundles server/ into the app for "Connect Cloudflare".
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Tests
        run: ./test.sh

      - name: Import Developer ID certificate
        id: cert
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Notarization profile
        if: steps.cert.outputs.signed == 'true'
        env:
          KEY: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          xcrun notarytool store-credentials sozvon --key "$RUNNER_TEMP/key.p8" --key-id "$KEY_ID" --issuer "$ISSUER"
          rm "$RUNNER_TEMP/key.p8"

      - name: Build, sign and notarize DMG
        env:
          VERSION: ${{ github.ref_name }}
          NOTARY_PROFILE: ${{ steps.cert.outputs.signed == 'true' && 'sozvon' || '' }}
        run: |
          export VERSION="${VERSION#v}"
          # Sparkle compares CFBundleVersion: the version itself keeps it growing across releases.
          export BUILD_NUMBER="$VERSION"
          ./build.sh dmg
          # Sozvon.dmg without a version: stable link releases/latest/download/Sozvon.dmg for the site and README
          cp build/Sozvon.dmg "build/Sozvon-$VERSION.dmg"
          shasum -a 256 "build/Sozvon-$VERSION.dmg" > "build/Sozvon-$VERSION.dmg.sha256"

      # appcast.xml for Sparkle (SUFeedURL = releases/latest/download/appcast.xml): this version only, the DMG
      # signed with the EdDSA key, release notes = this version's section of CHANGELOG.md rendered by GitHub.
      - name: Update feed
        if: steps.cert.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ -n "$ED_KEY" ] || { echo "ERROR: SPARKLE_ED_KEY secret is missing" >&2; exit 1; }
          printf '%s' "$ED_KEY" > "$RUNNER_TEMP/ed.key"
          SIG=$(.build/artifacts/sparkle/Sparkle/bin/sign_update --ed-key-file "$RUNNER_TEMP/ed.key" -p "build/Sozvon-$V.dmg")
          rm "$RUNNER_TEMP/ed.key"
          LEN=$(stat -f %z "build/Sozvon-$V.dmg")
          awk -v v="## $V" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes-only.md"
          NOTES=$(gh api markdown -f text="$(cat "$RUNNER_TEMP/notes-only.md")" -f mode=gfm)
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '<channel><title>Sozvon</title>'
            echo "<item><title>Sozvon $V</title>"
            echo "<pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>"
            echo "<sparkle:version>$V</sparkle:version><sparkle:shortVersionString>$V</sparkle:shortVersionString>"
            echo "<sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>"
            echo "<sparkle:fullReleaseNotesLink>https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME</sparkle:fullReleaseNotesLink>"
            echo "<description><![CDATA[$NOTES]]></description>"
            echo "<enclosure url=\"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Sozvon-$V.dmg\" length=\"$LEN\" type=\"application/octet-stream\" sparkle:edSignature=\"$SIG\"/>"
            echo '</item></channel></rss>'
          } > build/appcast.xml
          xmllint --noout build/appcast.xml
          cat build/appcast.xml | head -c 2000

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.cert.outputs.signed }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          FLAGS=""
          [ "$SIGNED" = "true" ] || FLAGS="--prerelease"
          # Notes: how to install, then this version's section of CHANGELOG.md.
          {
            echo "**Download [Sozvon.dmg](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Sozvon.dmg)**, open it and drag Sozvon to Applications. macOS 15 or later on Apple silicon (M1 or newer)."
            echo
            echo "Signed with a Developer ID and notarized by Apple. SHA-256: \`$(cut -d' ' -f1 build/Sozvon-$V.dmg.sha256)\`"
            echo
            awk -v v="## $V" '$0 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md
          } > "$RUNNER_TEMP/notes.md"
          FEED=""
          [ -f build/appcast.xml ] && FEED=build/appcast.xml
          gh release create "$GITHUB_REF_NAME" build/Sozvon.dmg build/Sozvon-$V.dmg build/Sozvon-$V.dmg.sha256 $FEED \
            --title "Sozvon $V" --notes-file "$RUNNER_TEMP/notes.md" $FLAGS
