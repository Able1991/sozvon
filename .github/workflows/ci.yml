# Сборка приложения и тесты на чистом Mac (Apple Silicon).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Select Xcode 26 (macOS 26 SDK for Liquid Glass)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Engine tests (fast, no models)
        working-directory: engine
        run: |
          uv sync --frozen
          ln -sf "$(.venv/bin/python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" .venv/bin/ffmpeg
          uv run --frozen pytest -q -m "not slow"
      - name: Localization check
        run: python3 tools/l10n.py check
      - name: App tests (SwiftPM)
        run: swift test
      - name: Build Sozvon.app and DMG
        run: ./build.sh dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sozvon-dmg
          path: build/Sozvon.dmg
          retention-days: 14
