# Сборка приложения и тесты на чистом Mac (Apple Silicon).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Xcode 26 (нужен SDK macOS 26 для Liquid Glass)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Python-тесты (без моделей, быстрые)
        working-directory: engine
        run: uv run --frozen pytest -q -m "not slow"
      - name: Переводы
        run: python3 tools/l10n.py check
      - name: Swift-тесты (SwiftPM)
        run: swift test
      - name: Сборка Sozvon.app и DMG
        run: ./build.sh dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Sozvon-dmg
          path: build/Sozvon.dmg
          retention-days: 14
