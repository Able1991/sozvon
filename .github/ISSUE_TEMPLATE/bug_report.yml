name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Please don't attach recordings, transcripts or summaries of real calls**, and don't paste names, emails or tokens: this issue is public.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Start a call in …
        2. …
  - type: input
    id: version
    attributes:
      label: Sozvon version
      description: Settings → About
      placeholder: "0.1.7"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Air M2"
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio setup
      description: Headphones (Bluetooth or wired), microphone, call app.
      placeholder: "AirPods Pro, Mac microphone, Google Meet in Chrome"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Settings → About → Diagnostics… makes a zip with logs and checks (no call text, no audio). Drag it here, or paste the relevant lines.
