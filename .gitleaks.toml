# Gitleaks: the default rules, plus two allowances.
[extend]
useDefault = true

[allowlist]
description = "Cloudflare Web Analytics beacon token: public by design, it ships in every page's HTML. Made-up keys in the log scrubber's test"
paths = ['''Tests/SozvonCoreTests/DiagnosticsTests\.swift''']
regexTarget = "line"
regexes = ['''data-cf-beacon='\{"token": "[0-9a-f]{32}"\}''']
